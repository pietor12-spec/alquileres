<script>
/* ══════════════════════════════════════════════════════════════
   TRACKER DE ALQUILERES · ingresos, gastos y fijos de las viviendas
   Un solo archivo: interfaz de escritorio + interfaz de móvil.
   Mismo sello visual que el resto de proyectos (Syne + JetBrains
   Mono, fondo azul noche, acento por vivienda).
   ══════════════════════════════════════════════════════════════ */

const SEED_STATE = { v: 2, movs: [], fijos: [], deleted: [] };

const STORE_KEY = "tracker:alquileres:unificado:v2";
const VISTA_KEY = "tracker:alquileres:vista";

/* mismo acento para las dos viviendas: dorado, el color del balance */
const ACENTO = { m: "#ffd740", rgb: "255,215,64", ink: "#241a00" };
const PROPS = {
  madrid:   { id: "madrid",   label: "Madrid",   full: "Piso Madrid",                  ini: "M" },
  donostia: { id: "donostia", label: "Donostia", full: "Piso Donostia · Intxaurrondo", ini: "D" },
  todas:    { id: "todas",    label: "Todas",    full: "Las dos viviendas",            ini: "∑" }
};
const ORDEN_PROP = ["madrid", "donostia", "todas"];

/* conceptos por tipo de movimiento */
const CONCEPTOS = {
  ingreso: ["Alquiler", "Garaje", "Otros"],
  gasto: ["IBI", "Caldera", "Comunidad", "Seguro Hogar", "Agua", "Luz", "Gas", "Basuras", "Derrama", "Reparaciones", "Otros"]
};
const KINDS = { ingreso: { label: "Ingreso", plural: "Ingresos", color: "#00e676", rgb: "0,230,118" },
                gasto:   { label: "Gasto",   plural: "Gastos",   color: "#ff5b6e", rgb: "255,91,110" } };

const NOW = new Date();
const YEAR_NOW = NOW.getFullYear();
const HOY = new Date(NOW.getTime() - NOW.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const MESES_C = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ── qué interfaz mostrar ──
   Manda la preferencia guardada; si no hay, decide el aparato:
   pantalla táctil Y dispositivo estrecho = móvil. El ancho de la
   ventana NO cuenta, porque la página puede abrirse en un panel. */
let VISTA_PREF = null;
try { VISTA_PREF = localStorage.getItem(VISTA_KEY); } catch (e) {}
const _q = (location.search.match(/vista=(movil|dashboard)/) || [])[1];
if (_q) { VISTA_PREF = _q; try { localStorage.setItem(VISTA_KEY, _q); } catch (e) {} }
const _tactil = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
const _pantalla = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 1200;
const MOBILE = (VISTA_PREF === "movil" || VISTA_PREF === "dashboard")
  ? VISTA_PREF === "movil"
  : (_tactil && _pantalla < 700);
function setVista(x) {
  try { localStorage.setItem(VISTA_KEY, x); } catch (e) {}
  location.reload();
}

/* ---------- estado ---------- */
let S = { movs: [], fijos: [], deleted: [] };
let U = {
  prop: "madrid", tab: "resumen", view: "resumen",
  fijoKind: "gasto", q: "", fKind: "", fTipo: "", fYear: "", fMes: "",
  sort: "fecha", dir: "desc", openY: [], mesAnyo: null, openSec: []
};
let editing = null, editingFijo = null;

/* ---------- utilidades ---------- */
const num = (x) => Number(x) || 0;
function money(n, dec) {
  if (dec == null) dec = 2;
  return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR",
    minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n || 0);
}
const money0 = (n) => money(n, 0);
const pct = (x, d) => (x == null ? "—" : (x * 100).toFixed(d == null ? 1 : d) + "%");
const sgn = (x) => (x >= 0 ? "+" : "");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (id) => document.getElementById(id);
const v = (id) => { const e = el(id); return e ? e.value : ""; };
/* el teclado español escribe coma: la aceptamos como separador decimal */
const vn = (id) => String(v(id)).replace(/\s/g, "").replace(",", ".");
const yOf = (e) => Number(String(e.date).slice(0, 4));
const mOf = (e) => Number(String(e.date).slice(5, 7)) - 1;
const dOf = (iso) => Number(String(iso).slice(8, 10));
const fechaLarga = (d) => { const p = String(d).split("-"); return Number(p[2]) + " de " + (MESES[Number(p[1]) - 1] || "").toLowerCase() + " de " + p[0]; };
const fechaCorta = (d) => { const p = String(d).split("-"); return Number(p[2]) + "/" + Number(p[1]) + "/" + p[0]; };
const esIng = (m) => m.kind === "ingreso";
const iniTipo = (t) => String(t).trim().slice(0, 3).toUpperCase();

/* siguiente mes conservando el día elegido (recortado al último del mes) */
function proximaFecha(iso, day) {
  const y0 = Number(String(iso).slice(0, 4)), m0 = Number(String(iso).slice(5, 7)) - 1;
  let y = y0, m = m0 + 1;
  if (m > 11) { m = 0; y++; }
  const ultimo = new Date(y, m + 1, 0).getDate();
  const dd = Math.min(day || dOf(iso), ultimo);
  return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(dd).padStart(2, "0");
}

/* ---------- selección y cálculo ---------- */
function listOf(p) {
  const l = S.movs.filter(m => p === "todas" || m.property === p);
  return l.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function fijosOf(p, kind) {
  return S.fijos.filter(f => (p === "todas" || f.property === p) && (!kind || f.kind === kind))
    .slice().sort((a, b) => (a.next < b.next ? -1 : 1));
}
function bloque(list, years, orden) {
  const found = [...new Set(list.map(m => m.type))];
  const types = [...(orden || []).filter(t => found.indexOf(t) >= 0), ...found.filter(t => (orden || []).indexOf(t) < 0).sort()];
  const matrix = {}, rowTotals = {}, rowCount = {}, colTotals = {}, byMonth = {};
  let grand = 0;
  types.forEach(t => { matrix[t] = {}; rowTotals[t] = 0; rowCount[t] = 0; });
  years.forEach(y => { colTotals[y] = 0; byMonth[y] = new Array(12).fill(0); });
  list.forEach(m => {
    const y = yOf(m);
    matrix[m.type][y] = (matrix[m.type][y] || 0) + num(m.amount);
    rowTotals[m.type] += num(m.amount); rowCount[m.type]++;
    colTotals[y] += num(m.amount); byMonth[y][mOf(m)] += num(m.amount);
    grand += num(m.amount);
  });
  return { types, matrix, rowTotals, rowCount, colTotals, byMonth, grand, n: list.length };
}
function stats(list) {
  const years = [...new Set(list.map(yOf))].filter(y => y).sort();
  const I = bloque(list.filter(esIng), years, CONCEPTOS.ingreso);
  const G = bloque(list.filter(m => !esIng(m)), years, CONCEPTOS.gasto);
  const bal = {};
  years.forEach(y => { bal[y] = (I.colTotals[y] || 0) - (G.colTotals[y] || 0); });
  const nY = years.length || 1;
  return { years, I, G, bal, balance: I.grand - G.grand, n: list.length, nY,
    balAnyo: (I.colTotals[YEAR_NOW] || 0) - (G.colTotals[YEAR_NOW] || 0),
    balPrev: (I.colTotals[YEAR_NOW - 1] || 0) - (G.colTotals[YEAR_NOW - 1] || 0) };
}

/* ---------- persistencia ----------
   Primero este dispositivo (nunca falla); la nube va aparte y sus
   problemas no impiden que el movimiento quede registrado. */
const SYNC = { mode: "local", doc: null, rev: 0, error: null };

function limpiaMov(m) {
  return { id: m.id || uid(), kind: m.kind === "ingreso" ? "ingreso" : "gasto",
    property: m.property === "donostia" ? "donostia" : "madrid",
    type: String(m.type || "Otros"), date: String(m.date || HOY), amount: num(m.amount),
    fijoId: m.fijoId || null, u: num(m.u) };
}
function limpiaFijo(f) {
  const next = String(f.next || f.proximo || HOY);
  return { id: f.id || uid(), kind: f.kind === "ingreso" ? "ingreso" : "gasto",
    property: f.property === "donostia" ? "donostia" : "madrid",
    type: String(f.type || "Otros"), amount: num(f.amount),
    day: num(f.day) || dOf(next), next: next, active: f.active !== false, u: num(f.u) };
}
function payload() {
  return { v: 2, movs: S.movs.map(limpiaMov), fijos: S.fijos.map(limpiaFijo), deleted: S.deleted.slice() };
}
function applyState(d) {
  if (!d) return;
  const arr = Array.isArray(d.movs) ? d.movs : (Array.isArray(d.entries) ? d.entries : null);
  if (arr) S.movs = arr.map(limpiaMov);
  S.fijos = Array.isArray(d.fijos) ? d.fijos.map(limpiaFijo) : [];
  S.deleted = Array.isArray(d.deleted) ? d.deleted.slice() : [];
}
/* Lo que este aparato tiene y la nube no (y no está borrado a
   propósito) se conserva y se vuelve a subir. */
function mergeRemote(d) {
  if (!d || (!Array.isArray(d.movs) && !Array.isArray(d.entries))) return false;
  const rm = new Set((d.movs || d.entries || []).map(m => m.id));
  const rf = new Set((d.fijos || []).map(f => f.id));
  const borrados = new Set(d.deleted || []);
  const mios = S.movs.filter(m => !rm.has(m.id) && !borrados.has(m.id)).map(m => Object.assign({}, m));
  const miosF = S.fijos.filter(f => !rf.has(f.id) && !borrados.has(f.id)).map(f => Object.assign({}, f));
  applyState(d);
  let faltan = false;
  if (mios.length) { S.movs = S.movs.concat(mios); faltan = true; }
  if (miosF.length) { S.fijos = S.fijos.concat(miosF); faltan = true; }
  return faltan;
}
const UI_KEYS = ["prop", "tab", "view", "fijoKind", "fKind", "fTipo", "fYear", "fMes", "sort", "dir", "mesAnyo"];
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && (Array.isArray(d.movs) || Array.isArray(d.entries))) {
      applyState(d);
      if (d.ui) UI_KEYS.forEach(k => { if (d.ui[k] != null) U[k] = d.ui[k]; });
    }
  } catch (e) {}
}
function saveLocal() {
  try {
    const d = payload(), ui = {};
    UI_KEYS.forEach(k => { ui[k] = U[k]; });
    d.ui = ui;
    localStorage.setItem(STORE_KEY, JSON.stringify(d));
  } catch (e) {}
}
function pushCloud(reintento) {
  if (SYNC.kind === "gist") { gistProgramar(); return; }
  if (!SYNC.doc) return;
  try {
    SYNC.rev = Date.now();
    const d = payload();
    d.rev = SYNC.rev;
    const limpio = JSON.parse(JSON.stringify(d));
    const pr = SYNC.doc.set(limpio);
    if (pr && pr.catch) pr.catch(e => {
      SYNC.error = (e && e.message) || "error al subir";
      if (!reintento) { setTimeout(() => pushCloud(true), 1500); return; }
      toast("Guardado aquí, pero no en la nube");
    });
  } catch (e) {
    SYNC.error = (e && e.message) || "error al subir";
    if (!reintento) setTimeout(() => pushCloud(true), 1500);
  }
}
function save() {
  try { saveLocal(); } catch (e) {}
  try { pushCloud(false); } catch (e) {}
}
function syncBadge() {
  document.querySelectorAll(".sync").forEach(b => {
    const ok = SYNC.mode === "cloud" && !SYNC.error;
    b.className = "sync " + (ok ? "ok" : "local");
    b.title = SYNC.error ? ("Error de sincronización: " + SYNC.error) : "";
    b.innerHTML = '<i></i>' + (ok ? "Sincronizado" : (SYNC.mode === "cloud" ? "Sin conexión · guardado aquí" : "Solo este dispositivo"));
  });
}
async function initSync() {
  try {
    if (typeof window.claude === "undefined" || !window.claude || !window.claude.use) { gistIniciar(); return; }
    const db = await window.claude.use("db");
    if (!db) return;
    SYNC.doc = db.doc("estado/alquileres");
    SYNC.mode = "cloud";
    const snap = await SYNC.doc.get();
    let subir = true;
    if (snap.exists) {
      const d = snap.data();
      if (d && (Array.isArray(d.movs) || Array.isArray(d.entries))) {
        SYNC.rev = num(d.rev);
        subir = mergeRemote(d);
      }
    }
    if (devengar()) subir = true;
    if (subir) pushCloud(false);
    SYNC.doc.onSnapshot(function (s) {
      if (!s.exists) return;
      const d = s.data();
      if (!d || (!Array.isArray(d.movs) && !Array.isArray(d.entries))) return;
      const rev = num(d.rev);
      if (rev && rev < SYNC.rev) return;            /* eco de una versión anterior */
      const antes = JSON.stringify(payload());
      let faltan = mergeRemote(d);
      if (devengar()) faltan = true;
      if (rev > SYNC.rev) SYNC.rev = rev;
      if (faltan) pushCloud(false);
      if (JSON.stringify(payload()) !== antes) { saveLocal(); repaint(); }
    }, function () { SYNC.mode = "local"; SYNC.doc = null; syncBadge(); });
    repaint(); syncBadge();
  } catch (e) {}
}


/* ══════════ SINCRONIZACIÓN ENTRE DISPOSITIVOS · GitHub Gist ══════════
   Los datos viven en un gist SECRETO de tu cuenta de GitHub (un único
   archivo JSON). Cada dispositivo guarda primero en local y luego
   fusiona con el gist: une registros por id, gana la edición más
   reciente y respeta los borrados. Sin servidor propio. */
const GH_TOKEN_KEY = "tracker:alquileres:gh-token";
const GH_GIST_KEY  = "tracker:alquileres:gist-id";
const GIST_FILE = "tracker-alquileres.json";
const GIST_DESC = "Tracker de Alquileres · datos de la app (no borrar)";
const G = { token: null, id: null, busy: false, again: false, timer: null, last: 0 };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, x) { try { if (x == null) localStorage.removeItem(k); else localStorage.setItem(k, x); } catch (e) {} }

async function gh(path, opts, token) {
  opts = opts || {};
  const r = await fetch("https://api.github.com" + path, {
    method: opts.method || "GET", cache: "no-store",
    headers: Object.assign({ "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + (token || G.token) },
      opts.body ? { "Content-Type": "application/json" } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) {
    const e = new Error(r.status === 401 ? "token no válido o caducado" :
      r.status === 403 || r.status === 404 ? "el token no tiene permiso de gist" : ("GitHub " + r.status));
    e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function gistBuscarOCrear(token) {
  for (let page = 1; page <= 5; page++) {
    const l = await gh("/gists?per_page=100&page=" + page, null, token);
    const f = (l || []).find(g => g.files && g.files[GIST_FILE]);
    if (f) return f.id;
    if (!l || l.length < 100) break;
  }
  const g = await gh("/gists", { method: "POST", body: { description: GIST_DESC, public: false,
    files: { [GIST_FILE]: { content: JSON.stringify(Object.assign(payload(), { app: "tracker-alquileres" })) } } } }, token);
  return g.id;
}
async function gistLeer() {
  const g = await gh("/gists/" + G.id);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let txt = f.content;
  if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url, { cache: "no-store" })).text();
  try { const d = JSON.parse(txt); return (d && (Array.isArray(d.movs) || Array.isArray(d.entries))) ? d : null; }
  catch (e) { return null; }
}
async function gistEscribir(d) {
  await gh("/gists/" + G.id, { method: "PATCH", body: { files: { [GIST_FILE]: {
    content: JSON.stringify(Object.assign({ app: "tracker-alquileres", rev: Date.now() }, d)) } } } });
}
function canon(d) {
  const by = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  return JSON.stringify({ m: (d.movs || d.entries || []).map(limpiaMov).sort(by),
    f: (d.fijos || []).map(limpiaFijo).sort(by), d: (d.deleted || []).slice().sort() });
}
function fusionar(a, b) {
  const del = new Set([].concat(a.deleted || [], b.deleted || []));
  function une(la, lb, esFijo) {
    const m = new Map();
    la.forEach(x => m.set(x.id, x));
    lb.forEach(y => {
      const x = m.get(y.id);
      if (!x) { m.set(y.id, y); return; }
      let w = num(y.u) > num(x.u) ? y : x;
      if (esFijo) w = Object.assign({}, w, { next: x.next > y.next ? x.next : y.next });
      m.set(y.id, w);
    });
    return Array.from(m.values()).filter(x => !del.has(x.id));
  }
  return { v: 2,
    movs: une((a.movs || []).map(limpiaMov), (b.movs || b.entries || []).map(limpiaMov), false),
    fijos: une((a.fijos || []).map(limpiaFijo), (b.fijos || []).map(limpiaFijo), true),
    deleted: Array.from(del) };
}
async function gistSync() {
  if (!G.token || !G.id) return;
  if (G.busy) { G.again = true; return; }
  G.busy = true;
  try {
    const remoto = await gistLeer();
    const local = payload();
    const mezcla = remoto ? fusionar(local, remoto) : local;
    if (canon(mezcla) !== canon(local)) {
      applyState(mezcla); devengar(); saveLocal(); repaint();
    }
    const fin = payload();
    if (!remoto || canon(fin) !== canon(remoto)) await gistEscribir(fin);
    SYNC.error = null; G.last = Date.now();
  } catch (e) {
    SYNC.error = (e && e.message) || "sin conexión";
    if (e && e.status === 401) toast("El token de GitHub ha caducado: vuelve a conectarlo en Datos");
  } finally {
    G.busy = false; syncBadge();
    if (G.again) { G.again = false; gistSync(); }
  }
}
function gistProgramar() {
  clearTimeout(G.timer);
  G.timer = setTimeout(gistSync, 700);
}
function gistIniciar() {
  G.token = lsGet(GH_TOKEN_KEY); G.id = lsGet(GH_GIST_KEY);
  if (!G.token || !G.id) return;
  SYNC.kind = "gist"; SYNC.mode = "cloud";
  syncBadge();
  gistSync();
}
async function gistConectar() {
  const t = (v("g-token") || "").trim();
  const errBox = el("g-err");
  if (!t) { if (errBox) errBox.innerHTML = '<div class="err">Pega antes el token.</div>'; return; }
  const b = el("g-con"); if (b) { b.disabled = true; b.textContent = "Conectando…"; }
  try {
    const id = await gistBuscarOCrear(t);
    lsSet(GH_TOKEN_KEY, t); lsSet(GH_GIST_KEY, id);
    G.token = t; G.id = id; SYNC.kind = "gist"; SYNC.mode = "cloud"; SYNC.error = null;
    await gistSync();
    toast("Sincronización activada");
    abrirDatos();
  } catch (e) {
    if (errBox) errBox.innerHTML = '<div class="err">No se pudo conectar: ' + esc(e.message) + '.</div>';
    if (b) { b.disabled = false; b.textContent = "Conectar"; }
  }
}
function gistDesconectar() {
  lsSet(GH_TOKEN_KEY, null); lsSet(GH_GIST_KEY, null);
  G.token = G.id = null; SYNC.kind = null; SYNC.mode = "local"; SYNC.error = null;
  syncBadge(); toast("Este dispositivo ya no sincroniza"); abrirDatos();
}
setInterval(() => { if (SYNC.kind === "gist" && !document.hidden) gistSync(); }, 45000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && SYNC.kind === "gist") gistSync(); });
window.addEventListener("online", () => { if (SYNC.kind === "gist") gistSync(); });

/* ── instalar como app ── */
let INSTALAR = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); INSTALAR = e; });
window.addEventListener("appinstalled", () => { INSTALAR = null; toast("App instalada"); });
const ES_STANDALONE = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
const ES_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
async function instalarApp() {
  if (!INSTALAR) return;
  INSTALAR.prompt();
  try { await INSTALAR.userChoice; } catch (e) {}
  INSTALAR = null; abrirDatos();
}
function syncHTML() {
  const linkTok = "https://github.com/settings/tokens/new?scopes=gist&description=Tracker%20Alquileres";

/* ---------- fijos: devengo automático ----------
   El identificador del movimiento generado es determinista
   (fijo + fecha), así que dos dispositivos que devengan el mismo
   recibo crean el MISMO registro y la fusión no lo duplica. */
function devengar() {
  const hechos = new Set(S.movs.map(m => m.id));
  const borrados = new Set(S.deleted);
  let n = 0;
  S.fijos.forEach(f => {
    if (!f.active) return;
    let guard = 0;
    while (f.next && f.next <= HOY && guard++ < 400) {
      const id = "fj-" + f.id + "-" + f.next;
      if (!hechos.has(id) && !borrados.has(id)) {
        S.movs.push({ id: id, kind: f.kind, property: f.property, type: f.type,
          date: f.next, amount: num(f.amount), fijoId: f.id });
        hechos.add(id); n++;
      }
      f.next = proximaFecha(f.next, f.day);
    }
  });
  return n;
}

/* ---------- mutaciones ---------- */
function addMov(m) { m.u = Date.now(); S.movs.push(m); save(); repaint(); }
function updMov(m) { m.u = Date.now(); S.movs = S.movs.map(x => (x.id === m.id ? m : x)); save(); repaint(); }
function delMov(id) {
  S.movs = S.movs.filter(x => x.id !== id);
  if (S.deleted.indexOf(id) < 0) S.deleted.push(id);
  save(); repaint();
}
function addFijo(f) { f.u = Date.now(); S.fijos.push(f); devengar(); save(); repaint(); }
function updFijo(f) { f.u = Date.now(); S.fijos = S.fijos.map(x => (x.id === f.id ? f : x)); devengar(); save(); repaint(); }
function delFijo(id) {
  S.fijos = S.fijos.filter(x => x.id !== id);
  if (S.deleted.indexOf(id) < 0) S.deleted.push(id);
  save(); repaint();
}
function toggleFijo(id) {
  S.fijos = S.fijos.map(f => {
    if (f.id !== id) return f;
    const nf = Object.assign({}, f, { active: !f.active, u: Date.now() });
    /* al reanudar, no se devengan los meses que estuvo en pausa */
    if (nf.active && nf.next < HOY) { while (nf.next < HOY) nf.next = proximaFecha(nf.next, nf.day); }
    return nf;
  });
  save(); repaint();
}

/* ---------- copia de seguridad ---------- */
function importar(raw, modo) {
  const p = JSON.parse(raw);
  const arrM = Array.isArray(p) ? p : (Array.isArray(p.movs) ? p.movs : (Array.isArray(p.entries) ? p.entries : null));
  if (!arrM) throw new Error("formato");
  const movs = arrM.map(limpiaMov);
  const fijos = Array.isArray(p.fijos) ? p.fijos.map(limpiaFijo) : [];
  if (modo === "merge") {
    const hm = new Set(S.movs.map(m => m.id)), hf = new Set(S.fijos.map(f => f.id));
    S.movs = S.movs.concat(movs.filter(m => !hm.has(m.id)));
    S.fijos = S.fijos.concat(fijos.filter(f => !hf.has(f.id)));
  } else {
    S.movs = movs; S.fijos = fijos; S.deleted = [];
  }
  devengar(); save(); repaint();
  return movs.length;
}
function exportJSON() {
  const d = payload();
  return JSON.stringify({ app: "tracker-alquileres", version: 2, exportedAt: new Date().toISOString(),
    movs: d.movs, fijos: d.fijos }, null, 2);
}
async function descargar() {
  const json = exportJSON(), nombre = "tracker-alquileres-" + HOY + ".json";
  /* dentro de la app de Claude la descarga va por su propio canal */
  try {
    if (typeof window.claude !== "undefined" && window.claude && window.claude.use) {
      const dl = await window.claude.use("downloads");
      if (dl && dl.save) { await dl.save({ filename: nombre, data: json }); toast("Archivo guardado"); return; }
    }
  } catch (e) { toast("Descarga cancelada"); return; }
  try {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Archivo descargado");
  } catch (e) { toast("Usa Copiar si no descarga"); }
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
  }
  toast("Copiado al portapapeles");
}

function preguntarSimple(t, sub, si, fn) {
  preguntar(t, fn);
  document.querySelectorAll('[data-act="ask-si"]').forEach(b => { b.textContent = si; });
  document.querySelectorAll('.modal .sub, .sheet .sub').forEach(x => { if (x.textContent === "Esta acción no se puede deshacer.") x.textContent = sub; });
}
/* ---------- aviso flotante ---------- */
let _tT = null;
function toast(m) {
  const t = el("toast");
  if (!t) return;
  t.textContent = m; t.classList.add("show");
  clearTimeout(_tT); _tT = setTimeout(() => t.classList.remove("show"), 2300);
}
/* la interfaz activa registra aquí su función de repintado */
let repaint = function () {};

/* ---------- acento según la vivienda ---------- */
function aplicarAcento() {
  const r = document.documentElement.style;
  r.setProperty("--m", ACENTO.m);
  r.setProperty("--m-rgb", ACENTO.rgb);
  r.setProperty("--m-ink", ACENTO.ink);
}

/* ══════════════ PIEZAS COMUNES ══════════════ */
const SV = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

};
const colorKind = (k) => (k === "ingreso" ? "var(--green)" : "#ff5b6e");

/* ── Tabla de balance: ingresos, gastos y resultado por año ── */
function balanceHTML(st) {
  if (!st.years.length) return "";
  const ys = st.years, N = ys.length + 2;
  const fila = (lab, vals, total, cls) => {
    let h = '<tr class="' + (cls || "") + '"><td>' + lab + '</td>';
    ys.forEach(y => { h += '<td>' + (vals[y] ? money0(vals[y]) : "—") + '</td>'; });
    return h + '<td class="tot">' + money0(total) + '</td></tr>';
  };
  const div = (v, k) => { const o = {}; ys.forEach(y => { o[y] = (v[y] || 0) / k; }); return o; };

  let h = '<table class="mx bal"><thead><tr><th></th>';
  ys.forEach(y => { h += '<th' + (y === YEAR_NOW ? ' class="tot"' : '') + '>' + y + '</th>'; });
  h += '<th class="tot">Total</th></tr></thead><tbody>';

  h += '<tr class="sec ing"><td colspan="' + N + '">Ingresos</td></tr>';
  st.I.types.forEach(t => { h += fila(esc(t), st.I.matrix[t], st.I.rowTotals[t]); });
  if (!st.I.types.length) h += '<tr class="vacia"><td colspan="' + N + '">Sin ingresos registrados</td></tr>';
  h += fila("Ingresos anual", st.I.colTotals, st.I.grand, "sum ing");
  h += fila("Ingresos mensual", div(st.I.colTotals, 12), st.I.grand / (st.nY * 12), "sub");

  h += '<tr class="sep"><td colspan="' + N + '"><div></div></td></tr>';
  h += '<tr class="sec gas"><td colspan="' + N + '">Gastos</td></tr>';
  st.G.types.forEach(t => { h += fila(esc(t), st.G.matrix[t], st.G.rowTotals[t]); });
  if (!st.G.types.length) h += '<tr class="vacia"><td colspan="' + N + '">Sin gastos registrados</td></tr>';
  h += fila("Gastos anual", st.G.colTotals, st.G.grand, "sum gas");
  h += fila("Gastos mensual", div(st.G.colTotals, 12), st.G.grand / (st.nY * 12), "sub");

  h += '<tr class="sep"><td colspan="' + N + '"><div></div></td></tr>';
  h += fila("Balance anual", st.bal, st.balance, "sum bal");
  h += fila("Balance mensual", div(st.bal, 12), st.balance / (st.nY * 12), "sub");

  return h + '</tbody></table>';
}

/* ── Paletas de los gráficos ── */
const PAL_ING = ["#00e676", "#5cf2a8", "#00b85c", "#9df5c8", "#00916f", "#3ddc97"];
const PAL_GAS = ["#ff5b6e", "#ff9385", "#d62f45", "#ffb9a6", "#a8243a", "#ff7a91"];

/* ── Barras por año: ingresos frente a gastos ── */
function leyendaHTML(conBalance) {
  return '<div class="leyenda"><span class="lg ing">Ingresos</span><span class="lg gas">Gastos</span>' +
    (conBalance ? '<span class="lg bal">Balance</span>' : '') + '</div>';
}
function barsHTML(st, sinLeyenda) {
  if (!st.years.length) return '<div class="empty">Sin datos todavía</div>';
  const max = Math.max.apply(null, st.years.map(y =>
    Math.max(st.I.colTotals[y] || 0, st.G.colTotals[y] || 0, Math.abs(st.bal[y] || 0)))) || 1;
  const alto = (v) => Math.max(3, Math.round(Math.abs(v) / max * 112));
  let h = (sinLeyenda ? '' : leyendaHTML(true)) + '<div class="bars">';
  st.years.forEach(y => {
    const i = st.I.colTotals[y] || 0, g = st.G.colTotals[y] || 0, b = st.bal[y] || 0;
    h += '<div class="bar' + (y === YEAR_NOW ? ' now' : '') + '">' +
      '<u class="btip"><em>' + y + '</em><div>' +
      '<span class="ing">' + money0(i) + '</span>' +
      '<span class="gas">' + money0(g) + '</span>' +
      '<span class="bal">' + money0(b) + '</span></div></u>' +
      '<div class="bt">' +
      '<i class="ing" style="height:' + alto(i) + 'px"></i>' +
      '<i class="gas" style="height:' + alto(g) + 'px"></i>' +
      '<i class="bal" style="height:' + alto(b) + 'px"></i>' +
      '</div><b>' + y + '</b></div>';
  });
  return h + '</div>';
}
function monthBarsHTML(st, year, sinLeyenda) {
  const I = st.I.byMonth[year] || new Array(12).fill(0), G = st.G.byMonth[year] || new Array(12).fill(0);
  const B = I.map((v, i) => v - G[i]);
  const max = Math.max.apply(null, I.concat(G, B.map(Math.abs))) || 1;
  const alto = (v) => Math.max(2, Math.round(Math.abs(v) / max * 112));
  let h = (sinLeyenda ? '' : leyendaHTML(true)) + '<div class="bars meses">';
  for (let i = 0; i < 12; i++) {
    h += '<div class="bar">' +
      '<u class="btip"><em>' + MESES[i] + '</em><div>' +
      '<span class="ing">' + money0(I[i]) + '</span>' +
      '<span class="gas">' + money0(G[i]) + '</span>' +
      '<span class="bal">' + money0(B[i]) + '</span></div></u>' +
      '<div class="bt"><i class="ing" style="height:' + alto(I[i]) + 'px"></i>' +
      '<i class="gas" style="height:' + alto(G[i]) + 'px"></i>' +
      '<i class="bal" style="height:' + alto(B[i]) + 'px"></i></div>' +
      '<b>' + MESES_C[i] + '</b></div>';
  }
  return h + '</div>';
}

/* ── Anillo de reparto por concepto ── */
function donutHTML(bl, kind, limite) {
  const total = bl.grand;
  if (!bl.types.length || !total) return '<div class="empty">Sin datos todavía</div>';
  const orden = bl.types.slice().sort((a, b) => bl.rowTotals[b] - bl.rowTotals[a]);
  let items = orden.map(t => ({ name: t, val: bl.rowTotals[t] }));
  if (limite && items.length > limite) {
    const resto = items.slice(limite).reduce((a, x) => a + x.val, 0);
    items = items.slice(0, limite).concat([{ name: "Otros conceptos", val: resto }]);
  }
  const pal = kind === "ingreso" ? PAL_ING : PAL_GAS;
  const R = 52, C = 2 * Math.PI * R;
  let off = 0, arcos = '', leyenda = '';
  items.forEach((it, i) => {
    const frac = it.val / total, len = Math.max(0, frac * C - 1.5), col = pal[i % pal.length];
    arcos += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="19" stroke-linecap="butt"' +
      ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"' +
      ' stroke-dashoffset="' + (-off).toFixed(2) + '"><title>' + esc(it.name) + ': ' + money(it.val) + '</title></circle>';
    off += frac * C;
    leyenda += '<div class="dleg-row"><span class="dot" style="background:' + col + '"></span>' +
      '<span class="dleg-name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
      '<span class="dleg-val">' + money0(it.val) + '</span>' +
      '<span class="dleg-pct">' + pct(frac, 0) + '</span></div>';
  });

    '<div class="dleg">' + leyenda + '</div></div>';

/* ── Balance acumulado mes a mes ── */
function lineaHTML(st, year) {
  if (!st.years.length) return '<div class="empty">Sin datos todavía</div>';
  const I = st.I.byMonth[year] || new Array(12).fill(0), G = st.G.byMonth[year] || new Array(12).fill(0);
  const acc = []; let s = 0;
  for (let i = 0; i < 12; i++) { s += (I[i] || 0) - (G[i] || 0); acc.push(s); }
  const W = 420, H = 150, P = 10;
  /* la escala se ajusta a lo que hay, con un respiro arriba y abajo,
     para que la curva se vea aunque el balance sea siempre alto */
  let lo = Math.min.apply(null, acc), hi = Math.max.apply(null, acc);
  if (hi === lo) { hi = lo + Math.max(1, Math.abs(lo) * 0.1); }
  const resp = (hi - lo) * 0.16;
  lo -= resp; hi += resp;
  const rango = (hi - lo) || 1;
  const px = (i) => P + i * ((W - 2 * P) / 11);
  const py = (v) => 12 + (hi - v) / rango * (H - 24);
  let d = '';
  acc.forEach((v, i) => { d += (i ? ' L ' : 'M ') + px(i).toFixed(1) + ' ' + py(v).toFixed(1); });
  const base = H - 12;
  const hayCero = lo < 0 && hi > 0;
  const area = d + ' L ' + px(11).toFixed(1) + ' ' + base.toFixed(1) + ' L ' + px(0).toFixed(1) + ' ' + base.toFixed(1) + ' Z';
  let puntos = '';
  acc.forEach((v, i) => { puntos += '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) + '" r="3"><title>' + MESES[i] + ': ' + money(v) + '</title></circle>'; });
  let etiquetas = '<div class="lx">';
  for (let i = 0; i < 12; i++) etiquetas += '<span>' + MESES_C[i] + '</span>';
  etiquetas += '</div>';
  return '<div class="linea"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="lg-bal" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="var(--m)" stop-opacity=".34"/><stop offset="100%" stop-color="var(--m)" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    (hayCero ? '<line class="cero" x1="' + P + '" y1="' + py(0).toFixed(1) + '" x2="' + (W - P) + '" y2="' + py(0).toFixed(1) + '"/>' : '') +
    '<path class="area" d="' + area + '" fill="url(#lg-bal)"/>' +
    '<path class="trazo" d="' + d + '"/>' +
    '<g class="pts">' + puntos + '</g></svg>' + etiquetas +
    '<div class="lfoot"><span>Balance acumulado ' + year + '</span><b>' + money(acc[11]) + '</b></div></div>';
}

/* ── Reparto por concepto (barras horizontales) ── */
function splitHTML(bl, total, kind, limite) {
  if (!bl.types.length) return '<div class="empty">Sin datos todavía</div>';
  const orden = bl.types.slice().sort((a, b) => bl.rowTotals[b] - bl.rowTotals[a]);
  const lista = limite ? orden.slice(0, limite) : orden;
  const max = bl.rowTotals[orden[0]] || 1;
  let h = '<div class="split">';
  lista.forEach(t => {
    const val = bl.rowTotals[t];
    h += '<div class="split-row">' +
      '<div class="split-name" title="' + esc(t) + '">' + esc(t) + '</div>' +
      '<div class="split-track"><i class="' + (kind === "ingreso" ? "ing" : "gas") + '" style="width:' + Math.max(2, (val / max) * 100).toFixed(1) + '%"></i></div>' +
      '<div class="split-val">' + money0(val) + '</div>' +
      '<div class="split-pct">' + (total ? pct(val / total, 0) : "—") + '</div></div>';
  });
  return h + '</div>';
}

/* ── Registro: lista filtrada ── */
function filtrada() {
  let l = listOf(U.prop);
  if (U.fKind) l = l.filter(m => m.kind === U.fKind);
  if (U.fTipo) l = l.filter(m => m.type === U.fTipo);
  if (U.fYear) l = l.filter(m => String(yOf(m)) === String(U.fYear));
  if (U.fMes !== "" && U.fMes != null) l = l.filter(m => mOf(m) === Number(U.fMes));
  const q = U.q.trim().toLowerCase();
  if (q) l = l.filter(m => (m.type + " " + m.date + " " + PROPS[m.property].label).toLowerCase().indexOf(q) >= 0);
  const dir = U.dir === "asc" ? 1 : -1;
  l.sort((a, b) => {
    if (U.sort === "importe") return (num(a.amount) - num(b.amount)) * dir;
    if (U.sort === "tipo") return a.type.localeCompare(b.type) * dir;
    return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * dir;
  });
  return l;
}

      '<div class="corte"></div>' +
      '<div class="chart-head" style="margin:0 0 16px"><div class="chart-title">Anual</div></div>' +
      barsHTML(st, true) +
      '</div></div></div>';
    return h;
  }

  function tablaMovs(list, kind) {
    let h = '<table class="rank-table"><thead><tr>' +
      '<th class="sortable" data-act="sort" data-s="tipo">Concepto</th>' +
      (U.prop === "todas" ? '<th>Vivienda</th>' : '') +
      '<th class="sortable" data-act="sort" data-s="fecha">Fecha</th>' +
      '<th class="r sortable" data-act="sort" data-s="importe">Importe</th>' +
      '<th class="r"></th></tr></thead><tbody>';
    list.forEach(m => {
      const c = colorKind(m.kind);
      h += '<tr><td><div class="tname"><div class="ini" style="background:' + (m.kind === "ingreso" ? "rgba(0,230,118,.13)" : "rgba(255,91,110,.13)") +
        ';color:' + c + ';border:1px solid ' + c + '55">' + iniTipo(m.type) + '</div>' + esc(m.type) +
        (m.fijoId ? ' <span class="tag">fijo</span>' : '') + '</div></td>' +
        (U.prop === "todas" ? '<td><span class="pill flat">' + PROPS[m.property].label + '</span></td>' : '') +
        '<td class="num" style="color:var(--muted)">' + fechaLarga(m.date) + '</td>' +
        '<td class="r num" style="color:' + c + '">' + (m.kind === "ingreso" ? "+" : "−") + money(m.amount) + '</td>' +
        '<td class="r"><button class="rowbtn" data-act="editar" data-id="' + m.id + '" title="Editar">' + ICO.lapiz + '</button>' +

  function vRegistro() {
    const st = stats(listOf(U.prop));

    let h = '<div class="toolbar">' + filtrosHTML(st) +
      '<button class="btn-primary" data-act="nuevo">＋ Añadir movimiento</button></div>';

    const bloqueHTML = (arr, kind) => {
      if (!arr.length) return "";

        '<button class="sec-head" data-act="sec" data-s="' + kind + '">' +

        '<div class="sec-right"><span class="sec-n">' + arr.length + (arr.length === 1 ? ' movimiento' : ' movimientos') + '</span>' +
        '<b style="color:' + colorKind(kind) + '">' + money(tot) + '</b>' +
        '<span class="chev' + (abierto ? ' open' : '') + '">▾</span></div></button>' +

    };
    return h + bloqueHTML(list.filter(esIng), "ingreso") + bloqueHTML(list.filter(m => !esIng(m)), "gasto");

  function vFijos() {
    const lista = fijosOf(U.prop, U.fijoKind);

      (U.fijoKind === "ingreso" ? "Ingresos" : "Gastos") + ' fijos</div>' +

  function vacio() {

      '<div class="sub">' + S.movs.length + ' movimientos · ' + S.fijos.length + ' fijos · ' +

  abrirNav = function (abierto) {

}

/* ══════════════ ACCIONES Y ARRANQUE ══════════════ */
let abrirForm = function () {};
let abrirFijo = function () {};
let abrirDatos = function () {};
let preguntar = function () {};
let cerrarTodo = function () {};
let abrirNav = function () {};
let ASK = null;

const movById = (id) => S.movs.filter(m => m.id === id)[0];
const fijoById = (id) => S.fijos.filter(f => f.id === id)[0];

function act(a, ds) {
  switch (a) {
    case "prop": U.prop = ds.p; U.fTipo = ""; U.fYear = ""; saveLocal(); repaint(); break;
    case "tab": U.tab = ds.t; abrirNav(false); saveLocal(); repaint(); break;
    case "view": U.view = ds.v; saveLocal(); repaint(); break;
    case "nav-open": abrirNav(true); break;
    case "nav-close": abrirNav(false); break;
    /* movimientos */
    case "nuevo":
      if (MOBILE && U.view === "fijos") abrirFijo(null, U.fijoKind);
      else abrirForm(null, U.fKind || "gasto");
      break;
    case "editar": abrirForm(movById(ds.id)); break;
    case "borrar": preguntar("¿Eliminar este movimiento?", () => { delMov(ds.id); toast("Movimiento eliminado"); }); break;
    /* fijos */
    case "fijoKind": U.fijoKind = ds.k; saveLocal(); repaint(); break;
    case "nuevo-fijo": abrirFijo(null, U.fijoKind); break;
    case "fj-edit": abrirFijo(fijoById(ds.id)); break;
    case "fj-toggle": toggleFijo(ds.id); break;
    case "fj-borrar": preguntar("¿Eliminar este fijo?", () => { delFijo(ds.id); toast("Fijo eliminado"); }); break;
    case "fj-save": fijoSave(); break;
    case "fj-del": preguntar("¿Eliminar este fijo?", () => { delFijo(ds.id); toast("Fijo eliminado"); }); break;
    /* datos y vistas */
    case "datos": abrirDatos(); break;
    case "vista-movil": setVista("movil"); break;
    case "vista-escritorio": setVista("dashboard"); break;
    case "mesAnyo": {
      const ys = stats(listOf(U.prop)).years;
      if (!ys.length) break;
      let i = ys.indexOf(U.mesAnyo);
      if (i < 0) i = ys.length - 1;
      i = Math.min(ys.length - 1, Math.max(0, i + Number(ds.d)));
      U.mesAnyo = ys[i];
      saveLocal(); repaint(); break;
    }
    case "year": {
      const y = Number(ds.y), i = U.openY.indexOf(y);
      if (i >= 0) U.openY.splice(i, 1); else U.openY.push(y);
      repaint(); break;
    }
    case "fKind": U.fKind = ds.k || ""; U.fTipo = ""; saveLocal(); repaint(); break;
    case "selYear": U.fYear = ds.v || ""; saveLocal(); repaint(); break;
    case "selMes": U.fMes = ds.v === "" ? "" : ds.v; saveLocal(); repaint(); break;
    case "selKind": U.fKind = ds.v || ""; saveLocal(); repaint(); break;
    case "selTipo": U.fTipo = ds.v || ""; saveLocal(); repaint(); break;
    case "sec": {
      const i = U.openSec.indexOf(ds.s);
      if (i >= 0) U.openSec.splice(i, 1); else U.openSec.push(ds.s);
      repaint(); break;
    }
    case "fTipo": U.fTipo = (U.fTipo === ds.t ? "" : (ds.t || "")); repaint(); break;
    case "fYear": U.fYear = ds.y || ""; repaint(); break;
    case "sort":
      if (U.sort === ds.s) U.dir = U.dir === "asc" ? "desc" : "asc";
      else { U.sort = ds.s; U.dir = ds.s === "tipo" ? "asc" : "desc"; }
      saveLocal(); repaint(); break;
    /* formulario */
    case "f-kind": formPick("kind", ds.k); break;
    case "f-prop": formPick("prop", ds.p); break;
    case "f-tipo": formPick("tipo", ds.t); break;
    case "f-save": formSave(); break;
    case "f-del": preguntar("¿Eliminar este movimiento?", () => { delMov(ds.id); toast("Movimiento eliminado"); }); break;
    /* copia de seguridad */
    case "d-copy": copiar(exportJSON()); break;
    case "d-down": descargar(); break;
    case "d-save": saveLocal(); pushCloud(false); toast("Guardado"); break;
    case "d-modo":
      D_MODO = ds.m;
      document.querySelectorAll('#d-modo button').forEach(b => b.classList.toggle("on", b.dataset.m === D_MODO));
      break;
    case "d-import": dataImport(); break;
    case "g-con": gistConectar(); break;
    case "g-off": preguntarSimple("¿Dejar de sincronizar este dispositivo?", "Los datos se quedan guardados aquí y en GitHub.", "Desconectar", gistDesconectar); break;
    case "g-now": gistSync().then(() => toast(SYNC.error ? "No se pudo sincronizar" : "Sincronizado")); break;
    case "instalar": instalarApp(); break;
    /* diálogos */
    case "ask-si": { const f = ASK; ASK = null; cerrarTodo(); if (f) f(); break; }
    case "close-ov": cerrarTodo(); break;
    case "close-sheet": cerrarTodo(); break;
  }
}

function arrancar() {
  const st = document.createElement("style");
  st.textContent = MOBILE ? CSS_MOB : CSS_DESK;
  document.head.appendChild(st);
  document.body.innerHTML = MOBILE ? HTML_MOB : HTML_DESK;

  loadLocal();
  if (devengar()) saveLocal();
  aplicarAcento();

  document.addEventListener("click", function (ev) {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    /* los desplegables y los campos de texto se manejan solos: si el clic
       repintase la vista, el desplegable se cerraría nada más abrirse */
    const et = b.tagName;
    if (et === "SELECT" || et === "INPUT" || et === "TEXTAREA" || et === "OPTION") return;
    const a = b.getAttribute("data-act");
    if ((a === "close-ov" || a === "close-sheet") && ev.target !== b) return;  /* solo el fondo cierra */
    ev.stopPropagation();
    act(a, b.dataset);
  });

  /* los desplegables de filtro avisan por 'change' */
  document.addEventListener("change", function (ev) {
    const sl = ev.target.closest("select[data-act]");
    if (!sl) return;
    act(sl.getAttribute("data-act"), { v: sl.value });
  });

  if (MOBILE) initMobile(); else initDesktop();
  syncBadge();
  initSync();
}

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

if (document.body) arrancar();
else document.addEventListener("DOMContentLoaded", arrancar);

</script>
</body>
</html>
